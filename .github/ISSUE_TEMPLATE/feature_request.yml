name: Feature request
description: Suggest something new for burrow-G
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today? Describe the situation, not the solution.
      placeholder: When I have dozens of sessions, the one I care about gets buried…
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should burrow-G do? Keys, screens, commands — whatever applies.
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Done when
      description: A short checklist that tells us the feature is finished.
      placeholder: |
        - [ ] …
        - [ ] …
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Implementation notes
      description: Optional. Where in the code this would go, edge cases, open questions.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Other ways to solve the problem, and why not.
